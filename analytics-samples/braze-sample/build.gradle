apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
	namespace 'com.example.braze_sample'

	// Braze 41.1.1 pulls AndroidX artifacts that require compileSdk 35.
	compileSdkVersion 35

	defaultConfig {
		applicationId "com.example.braze_sample"
		minSdkVersion 29
		targetSdkVersion rootProject.ext.targetSdkVersion
		versionCode 1
		versionName "1.0"

		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}

	lintOptions {
		// Since this is just a sample app, it's ok to ignore these warnings.
		disable 'IconMissingDensityFolder', 'GoogleAppIndexingWarning', 'AllowBackup'
	}

	buildFeatures {
		viewBinding true
	}

	kotlinOptions {
		jvmTarget = "1.8"
	}

	packaging {
		resources.excludes.add('LICENSE.txt')
	}
}

dependencies {
	implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
	implementation 'androidx.core:core-ktx:1.3.2'
	implementation 'androidx.appcompat:appcompat:1.2.0'

	implementation project(':analytics')
	implementation project(':analytics-braze')
	implementation 'com.braze:android-sdk-ui:41.1.1'

	testImplementation 'junit:junit:4.12'
	androidTestImplementation 'androidx.test.ext:junit:1.1.3'
	androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}
