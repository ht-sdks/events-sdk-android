name: Tagged release

# See RELEASING.md for information about the JitPack release process

on:
  push:
    # Pattern matched against refs/tags
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read # This is required for actions/checkout

jobs:
  verify-tag:
    name: Verify tag matches VERSION_NAME
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches VERSION_NAME
        run: |
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          test "$GITHUB_REF_NAME" = "$VERSION" || {
            echo "Tag $GITHUB_REF_NAME does not match VERSION_NAME=$VERSION"
            exit 1
          }
  publish:
    name: Publish to Maven Central
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Publish
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signAllPublications: "true"
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
  deploy-release:
    name: Message slack about latest release
    # Skip the entire Slack message job for now. Up until this point, the tag
    # push regex above required a "v" prefix on the tag name, but all releases
    # shipped so far have not had that prefix. So it's unclear if this has ever
    # run, and it may or may not work at all.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get new version number
        run: |
          echo "SEMVER=$GITHUB_REF_NAME" >> $GITHUB_ENV
          echo "DATE=$(date)" >> $GITHUB_ENV

      - name: Send message to Slack channel

        id: slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        env:
          PROJECT_NAME: "Android SDK"
          PACKAGE_URL: "https://jitpack.io/#ht-sdks/events-sdk-android/"
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ secrets.SLACK_RELEASE_CHANNEL_ID }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "New release: ${{ env.PROJECT_NAME }}"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Release: <${{ env.PACKAGE_URL }}|${{ env.SEMVER }}>*\n${{ env.DATE }}"
                  }
                }
              ]
            }
